name: PR Preview and Notify Reviewers

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build preview
        run: hugo --minify --baseURL "/"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const hasPost = files.data.some(f => f.filename.startsWith('content/posts/'));
            const body = hasPost
              ? `### New post submitted for review\n\n**Author:** @${author}\n\n**Build:** Passed successfully\n\n**Reviewers:** Please read through the post in the Files tab above and click "Review changes" to approve or request changes.\n\nOnce approved, merge this PR and the post will be live within 2 minutes at https://gareemamishra-glow.github.io/research-blog/`
              : `Build passed. Review the changes in the Files tab above.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
