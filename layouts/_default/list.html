{{ define "main" }}
<div class="container page-wrap">
  <div class="page-header">
    <h1>{{ .Title }}</h1>
  </div>
  <div class="card-grid card-grid-3">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="card">
      <div class="blog-card-meta">{{ .Date.Format "2006-01-02" }}</div>
      <h3 class="blog-card-title">{{ .Title }}</h3>
      <p class="blog-card-desc">{{ .Params.description | default .Summary }}</p>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
