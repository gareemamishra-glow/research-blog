{{ define "main" }}
<div class="article-wrap">
  <a href="{{ "/blog/" | relURL }}" class="article-back">← Blog</a>
  <div class="article-meta">
    <span>{{ .Date.Format "January 2, 2006" }}</span>
    <span>·</span>
    <span>{{ .ReadingTime }} min read</span>
  </div>
  <h1 class="article-title">{{ .Title }}</h1>
  {{ with .Params.description }}<p class="article-desc">{{ . }}</p>{{ end }}
  {{ with .Params.tags }}<div class="tags article-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>{{ end }}
  <hr class="article-divider">
  <div class="article-body">{{ .Content }}</div>
</div>
{{ end }}
