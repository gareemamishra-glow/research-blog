<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" role="img" aria-label="MSTACK">
  <defs>
    <style>
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- M -->
  <text x="0" y="52" class="logo-text" fill="#0A2472">M</text>

  <!-- ST -->
  <text x="52" y="52" class="logo-text" fill="#0A2472">ST</text>

  <!-- A with yellow diagonal accent -->
  <text x="138" y="52" class="logo-text" fill="#0A2472">A</text>
  <!-- Yellow slash accent cutting through the A -->
  <polygon points="148,14 160,14 168,46 156,46" fill="#F5C000" opacity="0.92"/>

  <!-- CK -->
  <text x="180" y="52" class="logo-text" fill="#0A2472">CK</text>

  <!-- Registered trademark -->
  <text x="296" y="18" fill="#0A2472" font-family="Arial, sans-serif" font-size="14" font-weight="400">®</text>
</svg>
